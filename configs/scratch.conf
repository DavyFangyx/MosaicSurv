# configs/scratch.conf
# 单跑迭代用草稿配置：bash run.sh configs/scratch.conf

EXP_GROUP=iter                                       # 想换实验组改这里
RUN_NAME=$(date +%m%d_%H%M%S)__scratch              # 想保留自动时间戳就别动；想换命名规则改这里

PRESET=survtri_poe_vae_B_nopretrain                 # 想换模型改这里；B 消融默认跳过 stage1 预训练
STUDY=tcga_lihc                                     # 想换数据集改这里
CLINIC_EXPERIMENT=L4                                # 想换 clinic 特征改这里
GENE_EXPERIMENT=scFoundation_embedding_cell_norm    # 想换 gene 特征改这里
WSI_EXPERIMENT=uni_v1                               # 想换 WSI 特征改这里
CONCAT_WSI=resampler                                # 仅 modality_concat 使用；默认 resampler
CONCAT_IMPUTE=zero                                  # 仅 modality_concat 使用：zero | mean

WANDB_MODE=online                                   # 想关掉 WandB 改成 disabled/offline
WANDB_PROJECT=SurvPGC_MultiVAE                      # 想换 WandB 项目改这里
WANDB_ENTITY=davyfangyuxuan-nanjing-university-of-aeronautics-and-ast

NUM_HEADS=8                                         # 想换 MHSA 头数改这里
CLIP_WEIGHT_IT=1.0                                  # 想换 CLIP I-T 权重改这里
CLIP_WEIGHT_IS=1.0                                  # 想换 CLIP I-S 权重改这里
CLIP_WEIGHT_TS=1.0                                  # 想换 CLIP T-S 权重改这里
POE_STAGE1_STUDIES=brca,coad,kirc,kirp,lihc        # crossstage1 的 stage1 数据池
BATCH_SIZE=128                                      # 想换 stage2 / 普通训练 batch size 改这里
BATCH_SIZE_STAGE1=128                               # 想换 stage1 batch size 改这里
MAX_EPOCHS_STAGE1=10                                # A/B 的 stage1 epoch；B_nopretrain 不使用
MAX_EPOCHS=20                                       # 想换训练 epoch 改这里
BAG_LOSS=cox_surv                                   # PoE-VAE 当前固定使用 Cox
