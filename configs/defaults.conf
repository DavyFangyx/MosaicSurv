# configs/defaults.conf
# 所有实验共用的默认值；具体 config 可按需覆盖。
# 这里尽量显式覆盖 utils/process_args.py 中会影响训练行为/结果目录的参数，
# 这样 effective_config.txt 能完整反映一次实验的真实运行配置。

# ---- 运行环境 ----
CONDA_ENV_NAME="SurvPGC"        # 想换 conda 环境改这里；若不需要激活可设为 "无"
PYTHON_BIN="python"             # 想换解释器改这里；例如 python3 或绝对路径
RESULTS_BASE="./results"        # 想换结果根目录改这里

# ---- 必填实验元数据（通常在具体 .conf 里覆盖）----
# EXP_GROUP="default"           # 想换实验组改具体 config
# RUN_NAME="default"            # 想换 run 名改具体 config
# PRESET="survpgc_f"            # 想换模型预设改具体 config

# ---- study / task ----
STUDY="tcga_coad"               # 想换数据集改这里
TASK="survival"                 # 当前仅支持 survival
N_CLASSES=4                     # survival 离散分桶数
TESTING=false                   # 想开 argparse --testing 改这里

# ---- 路径策略 ----
# 下面 5 个 *_PATH 若留空，则 run.sh 会按项目约定自动推导；
# 若你要用非标准目录，可直接在具体 config 中覆写成绝对/相对路径。
LABEL_FILE_PATH=""              # 默认自动推导为 datasets_csv/metadata/${STUDY}.csv
OMICS_DIR_PATH=""               # 默认自动推导为 datasets_csv/raw_rna_data/${TYPE_OF_PATH}/${study_subtype}
DATA_ROOT_DIR_PATH=""           # 默认自动推导为 SurvPGC_Workspace/${STUDY}/P/${WSI_EXPERIMENT}
CLINIC_DIR_PATH=""              # 默认自动推导为 SurvPGC_Workspace/${STUDY}/C/${CLINIC_EXPERIMENT}
GENE_DIR_PATH=""                # 默认自动推导为 SurvPGC_Workspace/${STUDY}/G/${GENE_EXPERIMENT}
SPLIT_DIR_PATH=""               # 默认自动推导为 splits/${WHICH_SPLITS}/${STUDY}

# ---- 模态数据源 ----
WHICH_SPLITS="5foldcv"          # 想换 split 目录改这里
WSI_EXPERIMENT="uni_v1"         # 想换 WSI 特征目录改这里
GENE_EXPERIMENT="scFoundation_embedding_gene_raw"   # 想换 gene 特征目录改这里
CLINIC_EXPERIMENT="L4"          # 想换 clinic 特征目录改这里；当前支持例如 L0-L5 / D0-D5
TYPE_OF_PATH="combine"          # xena | hallmarks | combine

# ---- 数据与编码 ----
NUM_PATCHES=4096                # 想换每例 patch 数改这里
LABEL_COL="survival_months"     # 想换生存标签列改这里
WSI_PROJECTION_DIM=256          # 想换 WSI 投影维度改这里
ENCODING_LAYER_1_DIM=8          # 想换 pathway encoder dim1 改这里
ENCODING_LAYER_2_DIM=16         # 想换 pathway encoder dim2 改这里
ENCODER_DROPOUT=0.25            # 想换 encoder dropout 改这里
SINGLE_MODEL_SIZE="small"       # 单模态模型大小 small | medium | big
SINGLE_USE_INPUT_LN=false       # 单模态 Gene FM 是否对输入做 LayerNorm
ENCODING_DIM=1024               # 想换 WSI encoding dim 改这里

# ---- split/fold ----
K=5                             # 想换 fold 数改这里
K_START=-1                      # 想只跑部分 fold 改这里
K_END=-1                        # 想只跑部分 fold 改这里

# ---- 训练超参 ----
MAX_EPOCHS=12                   # 想换 stage2/普通训练 epoch 改这里
LR=0.0005                       # 想换学习率改这里
SEED=1                          # 想换随机种子改这里
OPT="radam"                     # adam | sgd | adamW | radam | lamb
REG_TYPE="L2"                   # 当前代码主要按 L2 使用
WEIGHTED_SAMPLE=false           # 想启用 --weighted_sample 改这里
BATCH_SIZE=1                    # 想换普通模型 / stage2 batch size 改这里；HGCN 由 presets.sh 固定为 32
BAG_LOSS="nll_surv"             # nll_surv | nll_diff_surv | cox_surv | ...
ALPHA_SURV=0.5                  # 想换 uncensored 权重改这里
BETA_SURV=0.3                   # 想换 diff_loss 权重改这里
REG=0.001                       # 想换 weight decay 改这里
LR_SCHEDULER="cosine"           # 想换 lr scheduler 改这里
WARMUP_EPOCHS=1                 # 想换 warmup epoch 改这里

# ---- Stage-1（survfusion_* / survtri_poe_vae_b_crossstage1 使用）----
LR_STAGE1=0.0001                # 想换 stage1 学习率改这里
MAX_EPOCHS_STAGE1=30            # 想换 stage1 epoch 改这里
BATCH_SIZE_STAGE1=1             # 想换 stage1 batch size 改这里

# ---- Fusion / 对齐 / 消融超参 ----
FUSION="bilinear"               # porpoise/mcat 可用；想换融合方式改这里
SELECTED_MODALITIES="wsi,gene,clinic"   # SurvTri 模型使用的模态组合
FUSION_TYPE="mhsa"              # survfusion_separate 真实值通常由 preset 决定
NUM_HEADS=8                     # 想换 mhsa 头数改这里
CLIP_LAMBDA=0.01                # 想换 survfusion_joint 对齐权重改这里
CLIP_WEIGHT_IT=1.0              # 想换 CLIP I-T 权重改这里
CLIP_WEIGHT_IS=1.0              # 想换 CLIP I-S 权重改这里
CLIP_WEIGHT_TS=1.0              # 想换 CLIP T-S 权重改这里
LABEL_DIM=1                     # Cox 默认输出一个 risk score
POE_VARIANT="A"                 # A=线性探针，B=预训练后微调，C=联合训练
POE_SURV_LAMBDA=1.0             # TriPoEVAE-C 的 survival loss 权重
POE_ENCODER_LR_RATIO=0.1        # TriPoEVAE-B stage2: encoder/PoE/decoder LR = LR * this ratio
POE_MODALITY_DROPOUT=0.2        # TriPoEVAE 的模态 dropout 概率；unified_mask_csv 下会被强制为 0
MISSING_MODE="model_gen"        # model_gen | unified_mask_csv
MISSING_PATTERN=""              # unified_mask_csv 用，例如 60,0,0 / 0,60,0 / 20,20,20
MISSING_SEED=""                 # 空则沿用 SEED
EVAL_MODALITIES="off"            # off | all | P,C,G,PC,PG,CG,PCG | wsi,clinic
POE_DECODER_HIDDEN_DIM=512      # TriPoEVAE decoder hidden dim
POE_MMHID=256                   # TriPoEVAE fuse_fc hidden dim
POE_BETA_TARGET=1.0             # TriPoEVAE Jeffreys beta; warmup target, or fixed value when BETAFIX=true
BETAFIX=false                   # true 时传 --betafix，关闭 Jeffreys beta warmup
ALPHAFIX=false                  # true 时传 --alphafix，关闭可学习 PoE alpha
ALPHAPGC=""                     # alphafix 用，pathology,gene,clinic 权重，例如 0.5,0.3,0.2
POE_TRANSFORMER_LAYERS=1        # TriPoEVAE gene/clinic encoder layers
POE_STAGE1_STUDIES="brca,coad,kirc,kirp,lihc"  # cross-study stage1 pool for survtri_poe_vae_b_crossstage1
WANDB_MODE="disabled"           # disabled | offline | online
WANDB_PROJECT="SurvPGC"         # WandB 项目名
WANDB_ENTITY=""                 # WandB 组织/用户名；留空则不传

# ---- 其他模型开关 ----
RETURN_ATTN=false               # 想导出 attention 相关结果改这里
USE_NYSTROM=false               # 想启用 SurvPath 的 Nystrom attention 改这里

# ---- 缺失模态基线（modality_concat / mvae_poe / mopoe / hgcn）----
CONCAT_WSI="resampler"          # 默认 resampler；meanpool 代码仍在，但不作为当前入口
CONCAT_IMPUTE="zero"            # zero | mean；仅 modality_concat 使用
DATA_PACK_DIR_PATH=""           # 可选：直接喂 patients.pkl / sur_and_time.pkl / all_data.pkl；默认仍走 hgcn data 三模态 pkl
